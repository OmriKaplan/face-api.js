<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Detection Video Player</title>
    <script src="face-api.js"></script>
    <script src="js/commons.js"></script>
    <script src="js/faceDirectionDetector.js"></script>
    <link rel="stylesheet" href="imageSwitcherStyles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Face Detection Video Player</h1>
            <button id="cameraButton" class="camera-button" disabled>
                <svg class="camera-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                Start Camera
            </button>
        </div>
        <div id="error" class="error"></div>
        <div>
            <img id="contentImage" src="bananas-04.jpg" width="640" height="480" class="main-image"/>
            
            <div class="video-overlay" hidden>
                <video class="video-element" id="inputVideo" autoplay muted playsinline></video>
            </div>
        </div>
    </div>
    <div class="controls">
        <label for="easeThrashold">Ease Thrashold (1-100):</label>
        <input type="number" id="easeThrashold" value="10" min="1" max="100">
        <br>
        <label for="facePercentageOfImage">Face Percentage (1-100):</label>
        <input type="number" id="facePercentageOfImage" value="80" min="1" max="100">
    </div>
    <script src="js/imageSwitcher.js"></script>
</body>
</html>
